<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jamila store</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4f6;--card:#fff;--ink:#3b2233;--mute:#85707c;--acc:#b83a6b;--acc-ink:#fff;--line:#ecdce3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1219;--card:#2a1b24;--ink:#f6e8ef;--mute:#b399a6;--acc:#e0709b;--acc-ink:#2a1020;--line:#432a37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1219;--card:#2a1b24;--ink:#f6e8ef;--mute:#b399a6;--acc:#e0709b;--acc-ink:#2a1020;--line:#432a37;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,Arial,sans-serif;line-height:1.6;padding-bottom:90px}
header{padding:28px 18px 8px;max-width:640px;margin:auto}
h1{font-size:26px;margin:0 0 4px}
header p{margin:0;color:var(--mute);font-size:14px}
main{max-width:640px;margin:auto;padding:12px 14px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:120px 1fr}
.pic{position:relative;min-height:200px;background-size:cover;background-position:center}
.info{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.info h2{font-size:16px;margin:0}
.info small{color:var(--mute);font-size:12.5px}
.cnt{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:8px;padding:1px 7px}
.tabs{display:flex;gap:8px;max-width:640px;margin:6px auto 0;padding:0 14px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;cursor:pointer}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.price{font-weight:600;font-size:17px;color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.stock{font-size:12.5px;color:var(--mute)}
.stock.low{color:var(--acc)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);background:none;color:var(--acc);font-size:20px;cursor:pointer;font-family:inherit}
.qty button:disabled{opacity:.35;cursor:default}
.qty b{min-width:18px;text-align:center}
.out{color:var(--mute);font-size:14px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar button,.send{width:100%;max-width:640px;display:block;margin:auto;border:0;border-radius:12px;padding:13px;background:var(--acc);color:var(--acc-ink);font:600 16px "Readex Pro",Tahoma,sans-serif;cursor:pointer}
.bar button:disabled{opacity:.4}
dialog{width:min(92vw,520px);border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px}
.sum{font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.sum div{display:flex;justify-content:space-between}
label{display:block;font-size:13.5px;margin:10px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.note{font-size:12.5px;color:var(--mute);margin:10px 0}
.err{color:var(--acc);font-size:13px;min-height:18px}
.close{background:none;border:0;color:var(--mute);font:inherit;margin-top:8px;cursor:pointer;width:100%}
</style>
</head>
<body>
<header>
<h1 dir="ltr" style="text-align:right">Jamila store</h1>
<p>اختاري الأصناف والكمية، وابعتي الطلب على ماسنجر. هنأكد معاكي الطلب وموعد التوصيل.</p>
</header>
<div class="tabs" id="tabs"></div>
<main id="list"></main>
<div class="bar"><button id="open" disabled>اطلبي دلوقتي</button></div>

<dialog id="dlg">
<h3>مراجعة الطلب</h3>
<div class="sum" id="sum"></div>
<label for="n">الاسم</label><input id="n" autocomplete="name">
<label for="p">رقم الموبايل</label><input id="p" type="tel" inputmode="tel" autocomplete="tel">
<label for="a">العنوان والمحافظة</label><textarea id="a" rows="2"></textarea>
<div class="note">الدفع عند الاستلام فقط، والمعاينة متاحة عند الاستلام.</div>
<div class="err" id="err"></div>
<button class="send" id="send">كملي الطلب</button>
<button class="close" id="close">رجوع</button>
</dialog>

<dialog id="dlg2">
<h3>خطوة أخيرة</h3>
<div class="sum">١. الطلب اتنسخ. ٢. دوسي "افتحي ماسنجر". ٣. الصقي الطلب في المحادثة وابعتيه.</div>
<textarea id="ord" rows="7" readonly onclick="this.select()"></textarea>
<div class="note" id="cp"></div>
<a class="send" id="ms" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">افتحي ماسنجر</a>
<button class="close" id="close2">رجوع</button>
</dialog>

<script src="catalog.js"></script>
<script src="images.js"></script>
<script>
// ===== عدّلي هنا فقط =====
var PAGE = "jamila.homewear.eg"; // اسم مستخدم صفحة فيسبوك
PRODUCTS.forEach(function(p){ if(!p.img && !p.imgs && typeof IMGMAP!=="undefined" && IMGMAP[p.id]){ if(IMGMAP[p.id].length>1) p.imgs=IMGMAP[p.id]; else p.img=IMGMAP[p.id][0]; } });
// ==========================
var cart = {}; var idx = {}; var cur = "pj";
var CATS = [{id:"pj",name:"بيجامات"},{id:"as",name:"أسدالات"}];
var $ = function(i){return document.getElementById(i)};
function stripes(c){return "repeating-linear-gradient(90deg,"+c+" 0 14px,#fff9 14px 20px)"}
function total(){var t=0,q=0;PRODUCTS.forEach(function(p){var n=cart[p.id]||0;t+=n*p.price;q+=n});return {t:t,q:q}}
function render(){
  $("tabs").innerHTML = CATS.map(function(c){return '<button class="tab'+(c.id===cur?" on":"")+'" data-c="'+c.id+'">'+c.name+"</button>"}).join("");
  $("list").innerHTML = PRODUCTS.filter(function(p){return (p.cat||"pj")===cur}).map(function(p){
    var n = cart[p.id]||0, out = p.stock<=0;
    var stock = out ? "" : '<span class="stock'+(p.stock<=5?' low':'')+'">'+(p.stock===1?"آخر قطعة":p.stock<=5?"باقي "+p.stock+" بس":"متاح "+p.stock)+'</span>';
    var ctl = out ? '<span class="out">نفدت الكمية</span>' :
      '<div class="qty"><button data-d="-1" data-id="'+p.id+'" '+(n?'':'disabled')+'>−</button><b>'+n+'</b><button data-d="1" data-id="'+p.id+'" '+(n>=p.stock?'disabled':'')+'>+</button></div>';
    var im = p.imgs ? p.imgs[idx[p.id]||0] : p.img; var bg = im ? "url("+im+")" : stripes(p.color); var badge = p.imgs&&p.imgs.length>1 ? '<span class="cnt">'+((idx[p.id]||0)+1)+"/"+p.imgs.length+"</span>" : "";
    return '<div class="card"><div class="pic" data-pid="'+p.id+'" style="background-image:'+bg+(out?';opacity:.45':'')+'">'+badge+'</div><div class="info"><h2>'+p.name+'</h2><small>'+p.desc+'</small><span class="price">'+p.price+' جنيه</span><div class="row">'+stock+ctl+'</div></div></div>';
  }).join("") || '<div class="empty">مفيش أصناف هنا دلوقتي، هنضيفها قريب.</div>';
  var s=total(), b=$("open");
  b.disabled = !s.q;
  b.textContent = s.q ? "مراجعة الطلب ("+s.q+" قطعة، "+s.t+" جنيه)" : "اختاري صنف الأول";
}
$("tabs").onclick=function(e){var t=e.target.closest("[data-c]"); if(t){cur=t.dataset.c; render();}};
$("list").onclick=function(e){
  var pc=e.target.closest(".pic"); if(pc){var q=PRODUCTS.filter(function(x){return x.id==pc.dataset.pid})[0]; if(q&&q.imgs){idx[q.id]=((idx[q.id]||0)+1)%q.imgs.length; render();} return;}
  var b=e.target.closest("button"); if(!b) return;
  var id=+b.dataset.id, d=+b.dataset.d, p=PRODUCTS.filter(function(x){return x.id===id})[0];
  var n=(cart[id]||0)+d; if(n<0||n>p.stock) return; cart[id]=n; render();
};
function lines(){return PRODUCTS.filter(function(p){return cart[p.id]})}
$("open").onclick=function(){
  $("sum").innerHTML = lines().map(function(p){return '<div><span>'+p.name+' × '+cart[p.id]+'</span><span>'+cart[p.id]*p.price+'</span></div>'}).join("")+'<div><b>الإجمالي</b><b>'+total().t+' جنيه</b></div>';
  $("err").textContent=""; $("dlg").showModal();
};
$("close").onclick=function(){$("dlg").close()};
$("send").onclick=function(){
  var n=$("n").value.trim(), p=$("p").value.trim(), a=$("a").value.trim();
  if(!n||!p||!a){$("err").textContent="اكتبي الاسم والموبايل والعنوان.";return}
  var ref="ط"+Date.now().toString().slice(-6);
  var msg="طلب جديد "+ref+"\n\n"+lines().map(function(x){return "• "+x.name+" × "+cart[x.id]+" = "+cart[x.id]*x.price}).join("\n")+"\n\nالإجمالي: "+total().t+" جنيه\n\nالاسم: "+n+"\nالموبايل: "+p+"\nالعنوان: "+a;
  $("dlg").close();
  $("ord").value=msg; $("cp").textContent="";
  $("ms").href="https://m.me/"+PAGE;
  $("dlg2").showModal();
  function fb(){var t=$("ord");t.focus();t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}$("cp").textContent=ok?"تم نسخ الطلب.":"اضغطي على الصندوق وانسخي الطلب."}
  try{navigator.clipboard.writeText(msg).then(function(){$("cp").textContent="تم نسخ الطلب."},fb)}catch(e){fb()}
};
$("close2").onclick=function(){$("dlg2").close()};
render();
</script>
</body>
</html>
